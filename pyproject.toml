[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcr-als-toolbox"
version = "0.1.0"
description = "Python MCR-ALS numerical engine and desktop interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "scipy>=1.10",
]

[project.gui-scripts]
mcr-als-gui = "mcr_als.gui:main"

[tool.setuptools.packages.find]
include = ["mcr_als*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
